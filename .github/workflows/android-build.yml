name: Build Poco Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate relay Worker syntax
        run: node --check server/worker.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore persistent app signing key
        env:
          POCO_KEYSTORE_BASE64: ${{ secrets.POCO_KEYSTORE_BASE64 }}
        run: |
          test -n "$POCO_KEYSTORE_BASE64"
          echo "$POCO_KEYSTORE_BASE64" | base64 --decode > app/poco-release-key.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          POCO_KEYSTORE_PASSWORD: ${{ secrets.POCO_KEYSTORE_PASSWORD }}
          POCO_KEY_ALIAS: ${{ secrets.POCO_KEY_ALIAS }}
          POCO_KEY_PASSWORD: ${{ secrets.POCO_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK signature and manifest
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/poco-apk-signature.txt
          grep -F "Signer #1 certificate SHA-256 digest: 9d0791498de4fdd9214f0dd19f0558ee8464ae7cbe5ef88f9d5ceae7413cc053" /tmp/poco-apk-signature.txt

          "$AAPT" dump badging "$APK" | grep -F "package: name='ir.poco.assistant' versionCode='16' versionName='1.0.6'"

          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -Eq 'android:debuggable.*=true'; then
            echo "Release APK must not be debuggable."
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: poco-assistant-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
