plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.poco.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.poco.assistant'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.0.3'
    }

    signingConfigs {
        stable {
            storeFile file("$projectDir/poco-release-key.jks")
            storePassword System.getenv("POCO_KEYSTORE_PASSWORD")
            keyAlias System.getenv("POCO_KEY_ALIAS")
            keyPassword System.getenv("POCO_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
}
